[project]
name = "trialdesignbench"
version = "1.4.0"
description = "Evaluate whether AI agents can create efficient, reproducible, and safe clinical trial design"
authors = [{ name = "Nan Xiao", email = "me@nanx.me" }]
dependencies = ["pydantic>=2.13.4", "rich>=15.0.0", "typer>=0.25.1"]
readme = "README.md"
license = "MIT"

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Typing :: Typed",
]

requires-python = ">= 3.12"

[project.optional-dependencies]
# Rubric judge SDKs, one extra per model provider (`judge-<provider>`, the
# naming rule in `trialdesignbench.judge`). `judge` installs all of them, so
# the shared image can serve whichever judge a task selects. The
# `opencode-go` judge uses the standard library and needs no extra.
judge-anthropic = ["anthropic>=1.8.0"]
judge-openai = ["openai>=2.54.0"]
judge-xai = ["xai-sdk>=1.20.0"]
judge = ["trialdesignbench[judge-anthropic,judge-openai,judge-xai]"]
# Harbor runs agents in Docker (`tdb run`, `tdb regrade`). It is an optional
# extra so the core package stays light.
harbor = ["harbor==0.23.0"]

[project.scripts]
tdb = "trialdesignbench.cli.main:main"
trialdesignbench = "trialdesignbench.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["/data", "/docs", "/AGENTS.md", "/zensical.toml", "/uv.lock"]
wheel-exclude = ["/data", "/docs", "/AGENTS.md", "/zensical.toml", "/uv.lock"]

[tool.isort]
skip = [".venv", "vendor", "deps-src", "tmp"]
profile = "black"

[tool.mypy]
exclude = ["vendor/", "deps-src/", "tmp/", "site/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The xAI SDK and its gRPC and protobuf dependencies ship no type information.
module = ["xai_sdk", "xai_sdk.*", "grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "vendor", "deps-src", "tmp"]

[tool.uv]
# Supply chain hygiene: never resolve packages published in the last 7 days.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "anthropic>=1.8.0",
    "openai>=2.54.0",
    "xai-sdk>=1.20.0",
    "isort>=8.0.1",
    "mkdocstrings-python>=2.0.3",
    "mypy>=2.0.0",
    "pandas-stubs>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-openpyxl>=3.1.0",
    "zensical>=0.0.42",
]

[tool.ruff]
extend-exclude = ["deps-src", "vendor", "tmp"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
